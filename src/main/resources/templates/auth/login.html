<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - PlanbookAI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
                            300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
                            600: '#4f46e5', 700: '#4338ca', 800: '#3730a3',
                            900: '#312e81', 950: '#1e1b4b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gradient-to-br from-primary-950 via-slate-900 to-indigo-950 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md" x-data="loginForm()">
    <!-- Card Box -->
    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-gradient-to-tr from-primary-600 to-indigo-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-primary-500/30 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">PlanbookAI</h1>
            <p class="text-sm text-gray-500 mt-1">Hệ thống Trợ lý Soạn giáo án Hóa học thông minh</p>
        </div>

        <!-- Quick Role Switcher for Demo -->
        <div class="mb-6 p-3 bg-gray-50 rounded-xl border border-gray-200">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Đăng nhập nhanh theo vai trò:</p>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" @click="setAccount('admin@planbookai.com', '123456', 'ADMIN')"
                        class="px-2.5 py-1.5 text-xs font-medium rounded-lg border border-purple-200 bg-purple-50 text-purple-700 hover:bg-purple-100 transition">
                    👑 Quản trị viên (Admin)
                </button>
                <button type="button" @click="setAccount('manager@planbookai.com', '123456', 'MANAGER')"
                        class="px-2.5 py-1.5 text-xs font-medium rounded-lg border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 transition">
                    💼 Quản lý (Manager)
                </button>
                <button type="button" @click="setAccount('staff@planbookai.com', '123456', 'STAFF')"
                        class="px-2.5 py-1.5 text-xs font-medium rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 transition">
                    ✍️ Nhân viên (Staff)
                </button>
                <button type="button" @click="setAccount('teacher@planbookai.com', '123456', 'TEACHER')"
                        class="px-2.5 py-1.5 text-xs font-medium rounded-lg border border-amber-200 bg-amber-50 text-amber-700 hover:bg-amber-100 transition">
                    🎓 Giáo viên (Teacher)
                </button>
            </div>
        </div>

        <!-- Error Alert -->
        <div x-show="errorMessage" x-cloak class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span x-text="errorMessage"></span>
        </div>

        <!-- Form -->
        <form @submit.prevent="handleLogin" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email đăng nhập</label>
                <div class="relative">
                    <input type="email" x-model="email" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm"
                           placeholder="name@example.com">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <div class="relative">
                    <input :type="showPassword ? 'text' : 'password'" x-model="password" required
                           class="w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm"
                           placeholder="••••••••">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-show="!showPassword"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-show="showPassword" x-cloak><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded border-gray-300 text-primary-600 focus:ring-primary-500">
                    <span class="text-gray-600">Ghi nhớ đăng nhập</span>
                </label>
                <a href="#" class="text-primary-600 hover:text-primary-700 font-medium">Quên mật khẩu?</a>
            </div>

            <button type="submit" :disabled="loading"
                    class="w-full py-2.5 px-4 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl shadow-lg shadow-primary-600/30 transition duration-200 flex items-center justify-center gap-2 disabled:opacity-50">
                <svg x-show="loading" x-cloak class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span x-text="loading ? 'Đang xử lý...' : 'Đăng nhập vào Hệ thống'"></span>
            </button>
        </form>
    </div>

    <!-- Footer Note -->
    <p class="text-center text-xs text-gray-400 mt-6">
        &copy; 2026 PlanbookAI - Chuẩn sư phạm & Trí tuệ nhân tạo Gemini
    </p>
</div>

<script>
    function loginForm() {
        return {
            email: 'teacher@planbookai.com',
            password: 'password123',
            role: 'TEACHER',
            showPassword: false,
            loading: false,
            errorMessage: '',
            setAccount(email, pwd, role) {
                this.email = email;
                this.password = pwd;
                this.role = role;
            },
            handleLogin() {
                this.loading = true;
                this.errorMessage = '';

                // Client direct redirect based on role
                setTimeout(() => {
                    this.loading = false;
                    if (this.email.includes('admin')) {
                        window.location.href = '/admin/users';
                    } else if (this.email.includes('manager')) {
                        window.location.href = '/manager/packages';
                    } else if (this.email.includes('staff')) {
                        window.location.href = '/staff/questions';
                    } else {
                        window.location.href = '/teacher/dashboard';
                    }
                }, 600);
            }
        }
    }
</script>

</body>
</html>
