<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Khung chương trình (Template Builder)</title>
</head>
<body>
<div layout:fragment="content" x-data="templateBuilder()">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Khung chương trình</h1>
            <p class="text-sm text-gray-500 mt-1">Xây dựng cấu trúc mẫu cho giáo án</p>
        </div>
        <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
            Lưu Template
        </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Editor Left Side -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-medium text-gray-900 mb-4 border-b pb-2">Cấu trúc các phần</h2>
            
            <div class="space-y-4" id="sections-list">
                <template x-for="(section, index) in sections" :key="section.id">
                    <div class="border border-gray-200 rounded-lg p-4 bg-gray-50 flex items-start gap-4">
                        <div class="cursor-move text-gray-400 mt-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16" />
                            </svg>
                        </div>
                        <div class="flex-1 space-y-3">
                            <div>
                                <label class="block text-xs font-medium text-gray-500 uppercase">Tên phần</label>
                                <input type="text" x-model="section.title" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 uppercase">Mô tả (Hướng dẫn AI)</label>
                                <textarea x-model="section.prompt" rows="2" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></textarea>
                            </div>
                        </div>
                        <button @click="removeSection(index)" class="text-red-500 hover:text-red-700 p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                </template>
            </div>

            <button @click="addSection()" class="mt-4 w-full border-2 border-dashed border-gray-300 rounded-lg p-4 text-center text-gray-500 hover:text-indigo-600 hover:border-indigo-600 transition-colors font-medium text-sm flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                Thêm phần mới
            </button>
        </div>

        <!-- Preview Right Side -->
        <div class="bg-gray-50 rounded-xl shadow-sm border border-gray-200 p-6 h-full">
            <h2 class="text-lg font-medium text-gray-900 mb-4 border-b pb-2">Bản xem trước</h2>
            
            <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm min-h-[400px]">
                <h1 class="text-2xl font-bold text-center mb-6">GIÁO ÁN MẪU</h1>
                <div class="space-y-6">
                    <template x-for="section in sections" :key="section.id">
                        <div>
                            <h3 class="text-lg font-bold text-gray-800" x-text="section.title"></h3>
                            <div class="mt-2 text-sm text-gray-600 bg-gray-100 p-3 rounded italic border-l-4 border-indigo-400" x-text="'Prompt gợi ý: ' + section.prompt"></div>
                            <div class="mt-3 space-y-2">
                                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                                <div class="h-4 bg-gray-200 rounded w-full"></div>
                                <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function templateBuilder() {
        return {
            sections: [
                { id: 1, title: 'I. Mục tiêu bài học', prompt: 'Sinh ra mục tiêu về kiến thức, năng lực và phẩm chất cho học sinh.' },
                { id: 2, title: 'II. Thiết bị dạy học và học liệu', prompt: 'Liệt kê các thiết bị, phần mềm, tài liệu cần thiết.' },
                { id: 3, title: 'III. Tiến trình bài giảng', prompt: 'Trình bày các hoạt động: Khởi động, Hình thành kiến thức, Luyện tập, Vận dụng.' }
            ],
            addSection() {
                this.sections.push({
                    id: Date.now(),
                    title: 'Phần mới',
                    prompt: 'Nhập mô tả cho AI...'
                });
            },
            removeSection(index) {
                this.sections.splice(index, 1);
            }
        }
    }
</script>
</body>
</html>
