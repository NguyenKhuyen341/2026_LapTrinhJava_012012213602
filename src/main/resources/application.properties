# PlanbookAI Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/planbookai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Upload file configurations (for student answer sheets)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Secrets (for security configs)
jwt.secret=PlanbookAISuperSecretKey2026WithAtLeast256BitsOfLengthMustBeHere
jwt.expiration=86400000